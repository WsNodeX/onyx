name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no dependencies required)
        run: python -m pip install --upgrade pip
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Smoke test the CLI
        run: python -m onyx run examples.demo_app:app --port 8000 &
          sleep 2
          curl -s http://127.0.0.1:8000/ | grep -q "Onyx demo"
          curl -s -X POST http://127.0.0.1:8000/api/todos -H "Content-Type: application/json" -d '{"title":"buy milk"}' | grep -q '"id"'
          kill %1 2>/dev/null || true
